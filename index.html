<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>暗影裂隙 · 冒险模式原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 20%, #1e2436 0%, #0b0e17 70%);
    color: #e8e6df;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 4px;
    color: #d4af6a;
    text-shadow: 0 0 12px rgba(212,175,106,.4);
    margin-bottom: 8px;
  }
  .board {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .hero-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-radius: 14px;
    background: linear-gradient(145deg, #232a3d, #161b28);
    border: 1px solid #333c55;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 4px 14px rgba(0,0,0,.4);
  }
  .hero { display: flex; align-items: center; gap: 10px; }
  .hero-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    border: 2px solid #d4af6a;
    background: radial-gradient(circle at 35% 30%, #3a4460, #141824);
    box-shadow: 0 0 10px rgba(212,175,106,.3);
  }
  .hero.enemy .hero-avatar { border-color: #c0504d; box-shadow: 0 0 10px rgba(192,80,77,.4); }
  .hero-info { display: flex; flex-direction: column; gap: 2px; }
  .hero-name { font-size: 13px; color: #aab2c8; letter-spacing: 1px; }
  .hp-bar {
    width: 140px; height: 14px;
    background: #0d1019;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #333c55;
    position: relative;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #7a1f1f, #c0504d);
    transition: width .3s ease;
  }
  .hp-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold; color: #fff;
    text-shadow: 0 1px 2px #000;
  }
  .battlefield {
    min-height: 150px;
    border-radius: 14px;
    padding: 12px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 2px, transparent 2px 12px),
      linear-gradient(160deg, #1a2030, #0e121c);
    border: 1px solid #2c3448;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .battlefield.enemy-field { min-height: 120px; }
  .field-label {
    font-size: 10px; letter-spacing: 2px; color: #5c6680;
    width: 100%; margin-bottom: 2px;
  }
  .minion {
    width: 82px; height: 100px;
    border-radius: 10px;
    background: linear-gradient(160deg, #2e3852, #1b2133);
    border: 1px solid #4a5678;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 3px 10px rgba(0,0,0,.4);
  }
  .minion:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .minion.enemy { background: linear-gradient(160deg, #3a2730, #22161c); border-color: #6b3b44; }
  .minion.taunt { outline: 2px solid #d4af6a; }
  .minion .icon { font-size: 26px; margin-bottom: 2px; }
  .minion .name { font-size: 10px; color: #c9d2e8; text-align: center; line-height: 1.2; padding: 0 4px; }
  .minion .stats {
    position: absolute; bottom: 4px;
    display: flex; justify-content: space-between; width: 100%; padding: 0 6px;
  }
  .atk, .hp {
    font-weight: bold; font-size: 12px;
    min-width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 1px 2px #000;
  }
  .atk { background: #8a5a1a; color: #ffe6a8; }
  .hp { background: #7a1f1f; color: #ffd9d9; }
  .minion.can-attack { box-shadow: 0 0 0 2px #5ad47a, 0 3px 10px rgba(0,0,0,.4); }
  .minion.ready { border-color: #5ad47a; }
  .hand-area {
    min-height: 150px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 6px;
    padding: 8px;
    flex-wrap: wrap;
  }
  .card {
    width: 110px; height: 150px;
    border-radius: 10px;
    background: linear-gradient(165deg, #3a2f1c, #1e1810);
    border: 2px solid #d4af6a;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 8px 6px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .card.spell { background: linear-gradient(165deg, #1c2f3a, #101a21); border-color: #5fb0d4; }
  .card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 10px 24px rgba(0,0,0,.6); }
  .card.disabled { opacity: .45; filter: grayscale(.6); cursor: not-allowed; }
  .card .cost {
    position: absolute; top: -8px; left: -8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a8ad4, #1a3a6a);
    border: 2px solid #8fc4ff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 13px; color: #fff;
    text-shadow: 0 1px 2px #000;
  }
  .card .art { font-size: 30px; margin: 6px 0 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .card .cname { font-size: 11px; font-weight: bold; color: #f0e6c8; text-align: center; line-height: 1.2; }
  .card .desc { font-size: 9px; color: #b0b8c8; text-align: center; margin-top: 4px; line-height: 1.3; }
  .card .stats {
    position: absolute; bottom: 8px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 6px;
    pointer-events: none;
  }
  .card:not(.spell) .desc { margin-bottom: 18px; }
  .card.spell .cname { color: #bfe3ff; }
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-radius: 14px;
    background: linear-gradient(145deg, #232a3d, #161b28);
    border: 1px solid #333c55;
    gap: 12px;
  }
  .mana { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: bold; color: #8fc4ff; }
  .mana .orb {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ab0ff, #1a3a6a);
    border: 2px solid #a8d4ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
    box-shadow: 0 0 10px rgba(106,176,255,.4);
  }
  .btn {
    padding: 10px 22px;
    border-radius: 10px;
    border: 1px solid #d4af6a;
    background: linear-gradient(180deg, #4a3a1c, #2a2010);
    color: #f0e6c8;
    font-size: 13px; font-weight: bold; letter-spacing: 1px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { background: linear-gradient(180deg, #5c4a24, #3a2c16); box-shadow: 0 0 14px rgba(212,175,106,.3); }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn.secondary { border-color: #5fb0d4; background: linear-gradient(180deg, #1c3a4a, #101e26); color: #bfe3ff; }
  .btn.secondary:hover { background: linear-gradient(180deg, #244a5c, #162a36); }
  .btn .mana-pip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ab0ff, #1a3a6a);
    border: 1px solid #a8d4ff; color: #fff;
    font-size: 11px; font-weight: bold;
    text-shadow: 0 1px 2px #000;
    box-shadow: 0 0 6px rgba(106,176,255,.4);
    vertical-align: middle; margin-left: 2px;
  }
  .log {
    width: 100%; max-width: 960px;
    height: 70px; overflow-y: auto;
    font-size: 11px; color: #8a94aa;
    padding: 6px 10px;
    background: rgba(0,0,0,.25);
    border-radius: 10px;
    border: 1px solid #232a3d;
    line-height: 1.6;
  }
  .log div { border-bottom: 1px solid rgba(255,255,255,.03); padding: 1px 0; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,7,12,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .panel {
    background: linear-gradient(160deg, #232a3d, #12161f);
    border: 1px solid #d4af6a;
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    max-width: 480px;
    box-shadow: 0 0 40px rgba(212,175,106,.2);
  }
  .panel h2 { color: #d4af6a; margin-bottom: 12px; letter-spacing: 2px; }
  .panel p { color: #b0b8c8; font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
  .panel .choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .choice-card {
    width: 120px; padding: 10px;
    border-radius: 10px;
    background: linear-gradient(165deg, #3a2f1c, #1e1810);
    border: 2px solid #d4af6a;
    cursor: pointer;
    transition: transform .15s;
  }
  .choice-card:hover { transform: translateY(-4px); }
  .choice-card .icon { font-size: 28px; }
  .choice-card .cname { font-size: 11px; font-weight: bold; color: #f0e6c8; margin: 4px 0; }
  .choice-card .desc { font-size: 9px; color: #b0b8c8; }
</style>
</head>
<body>
<h1>暗影裂隙 · 冒险模式</h1>

<div class="board">
  <!-- 敌方英雄 -->
  <div class="hero-row">
    <div class="hero enemy">
      <div class="hero-avatar" id="enemyAvatar">💀</div>
      <div class="hero-info">
        <div class="hero-name" id="enemyName">暗影领主</div>
        <div class="hp-bar"><div class="hp-fill" id="enemyHpFill" style="width:100%"></div><div class="hp-text" id="enemyHpText">30 / 30</div></div>
      </div>
    </div>
    <div style="font-size:11px;color:#8a94aa;text-align:right;line-height:1.6">
      关卡 <span id="stageNum">1</span> / 3<br>
      <span id="enemySkillDesc">英雄技能：每回合对英雄造成 1 点伤害</span>
    </div>
  </div>

  <!-- 敌方战场 -->
  <div class="battlefield enemy-field" id="enemyField">
    <div class="field-label">敌方随从</div>
  </div>

  <!-- 我方战场 -->
  <div class="battlefield" id="playerField">
    <div class="field-label">我方随从</div>
  </div>

  <!-- 我方英雄 -->
  <div class="hero-row">
    <div class="hero">
      <div class="hero-avatar" id="playerAvatar">🛡️</div>
      <div class="hero-info">
        <div class="hero-name" id="playerName">冒险者</div>
        <div class="hp-bar"><div class="hp-fill" id="playerHpFill" style="width:100%"></div><div class="hp-text" id="playerHpText">30 / 30</div></div>
      </div>
    </div>
    <div class="mana">
      <div class="orb" id="manaOrb">0/0</div>
      <span style="font-size:11px;color:#8a94aa">法力水晶</span>
    </div>
  </div>

  <!-- 手牌 -->
  <div class="hand-area" id="handArea"></div>

  <!-- 底部 -->
  <div class="bottom-bar">
    <div style="font-size:11px;color:#8a94aa" id="deckInfo">牌库：20 张</div>
    <button class="btn secondary" id="heroPowerBtn" title="英雄技能"></button>
    <button class="btn" id="endTurnBtn">结束回合</button>
  </div>

  <div class="log" id="log"></div>
</div>

<!-- 关卡结算 / 选牌遮罩 -->
<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="overlayTitle">胜利！</h2>
    <p id="overlayText">选择一张卡牌加入你的牌库。</p>
    <div class="choices" id="choices"></div>
  </div>
</div>

<script>
// ============ 卡牌数据（不变） ============
const CARD_POOL = [
  { id:'strike', name:'打击', cost:1, type:'minion', atk:2, hp:1, icon:'⚔️', desc:'冲锋' , charge:true},
  { id:'guard',  name:'守卫', cost:2, type:'minion', atk:1, hp:4, icon:'🛡️', desc:'嘲讽', taunt:true },
  { id:'wolf',   name:'荒野狼', cost:3, type:'minion', atk:4, hp:3, icon:'🐺', desc:'' },
  { id:'golem',  name:'石傀儡', cost:4, type:'minion', atk:3, hp:6, icon:'🗿', desc:'嘲讽', taunt:true },
  { id:'fire',   name:'火球术', cost:2, type:'spell', dmg:3, icon:'🔥', desc:'造成 3 点伤害' },
  { id:'heal',   name:'治疗之光', cost:1, type:'spell', heal:4, icon:'✨', desc:'恢复 4 点生命' },
  { id:'draw',   name:'智慧', cost:2, type:'spell', draw:2, icon:'📖', desc:'抽 2 张牌' },
  { id:'bolt',   name:'闪电箭', cost:1, type:'spell', dmg:2, icon:'⚡', desc:'造成 2 点伤害' },
  { id:'knight', name:'骑士', cost:3, type:'minion', atk:3, hp:3, icon:'🐴', desc:'冲锋', charge:true },
  { id:'priest', name:'祭司', cost:2, type:'minion', atk:1, hp:3, icon:'🧙', desc:'战吼：恢复 2 点生命', battlecry:'heal2' },
];

// ============ 英雄技能配置（不变） ============
const HERO_POWERS = {
  fireball: {
    name: '火球冲击',
    cost: 2,
    icon: '🔥',
    type: 'damage',
    value: 1,
    desc: '造成 1 点伤害',
  },
};

// ============ 英雄注册表（第①步新增） ============
// 每个英雄拥有 forms（形态）。当前只有 base；第③步变身系统会用到 enraged 等。
// 形态字段：
//   玩家：name/avatar/maxHp/heroPower(字符串,查 HERO_POWERS)/deck
//   Boss：name/avatar/maxHp/heroPowerDesc/skillType/skillVal/deck
const HEROES = {
  adventurer: {
    key: 'adventurer',
    initialForm: 'base',
    forms: {
      base: {
        name: '冒险者',
        avatar: '🛡️',
        maxHp: 30,
        heroPower: 'fireball',
        deck: [
          'strike','strike','strike','strike','strike','strike',
          'guard','guard','wolf','fire','heal','draw','bolt','knight','priest',
        ],
      },
      // ===== 预留：玩家首次降到 5 血存活 → 切换到此形态（第③步填） =====
      // enraged: {
      //   name: '狂化冒险者', avatar: '🩸', maxHp: 30, heroPower: '???', deck: [...],
      //   // 负面效果字段随第③步设计补充
      // },
    },
  },
  // ===== 预留：第④步新增英雄，照此格式追加 =====
  // stormcaller: { key:'stormcaller', initialForm:'base', forms:{ base:{...}, ... } },
};

// 当前使用的玩家英雄
const PLAYER_HERO_KEY = 'adventurer';

// ============ 关卡 / Boss 注册表（改为 forms 结构，与英雄同构） ============
const STAGES = [
  {
    key: 'shadowlord',
    initialForm: 'base',
    forms: {
      base: {
        name:'暗影领主', avatar:'💀', maxHp:30,
        heroPowerDesc:'每回合对英雄造成 1 点伤害',
        skillType:'dot', skillVal:1,
        deck:['strike','strike','guard','wolf','fire','bolt'],
      },
      // ===== 预留：Boss 死亡 → 二阶段（第③步填） =====
      // phase2: { name:'暗影领主·真身', avatar:'👹', maxHp:45, heroPowerDesc:'...', skillType:'...', skillVal:2, deck:[...] },
    },
  },
  {
    key: 'lavabeast',
    initialForm: 'base',
    forms: {
      base: {
        name:'熔岩巨兽', avatar:'🌋', maxHp:40,
        heroPowerDesc:'每回合召唤一个 1/1 的火元素',
        skillType:'summon', skillVal:1,
        deck:['fire','fire','wolf','golem','strike','guard'],
      },
    },
  },
  {
    key: 'necromancer',
    initialForm: 'base',
    forms: {
      base: {
        name:'亡灵巫师', avatar:'🧟', maxHp:50,
        heroPowerDesc:'每回合抽 1 张牌并造成 1 点伤害',
        skillType:'drain', skillVal:1,
        deck:['bolt','bolt','priest','knight','guard','fire','draw'],
      },
    },
  },
];

// ============ 游戏状态 ============
let state = {
  stage: 0,
  turn: 1,
  player: null,          // 英雄实例对象（见 createHeroInstance）
  enemy: null,           // Boss 实例对象
  mana: 0, maxMana: 0,
  deck: [], hand: [], playerField: [], enemyField: [],
  enemyDeck: [], enemyHand: [],
  selectedAttacker: null,
  gameOver: false,
  heroPowerUsed: false,
  bonusCards: [],
};

// ============ 工具 ============
const $ = id => document.getElementById(id);
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; };

function log(msg){
  const el = $('log');
  const d = document.createElement('div');
  d.textContent = '· ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function makeCard(id){
  const base = CARD_POOL.find(c => c.id === id);
  return { ...base, uid: Math.random().toString(36).slice(2) };
}

// ============ 英雄实例（第①步新增） ============
// 从注册表构造一个运行时英雄实例，读取 initialForm。
function createHeroInstance(reg, formKey){
  const fk = formKey || reg.initialForm;
  const form = reg.forms[fk];
  return {
    key: reg.key,
    form: fk,
    name: form.name,
    avatar: form.avatar,
    hp: form.maxHp,
    maxHp: form.maxHp,
    heroPower: form.heroPower,
    heroPowerDesc: form.heroPowerDesc,
    skillType: form.skillType,
    skillVal: form.skillVal,
    deckTemplate: form.deck ? [...form.deck] : [],
    forms: reg.forms,
  };
}

// ============ 形态切换（第③步变身系统预留接口） ============
// applyForm(inst, 'enraged', { preserveHp:true })
// 注意：变身“不打断当前结算”，调用方需在安全点（结算之间）调用。
function applyForm(inst, formKey, opts = {}){
  const form = inst.forms[formKey];
  if(!form){ console.warn('未知形态:', formKey); return; }
  inst.form = formKey;
  inst.name = form.name;
  inst.avatar = form.avatar;
  inst.maxHp = form.maxHp;
  inst.hp = opts.preserveHp ? Math.min(inst.hp, form.maxHp) : form.maxHp;
  inst.heroPower = form.heroPower;
  inst.heroPowerDesc = form.heroPowerDesc;
  inst.skillType = form.skillType;
  inst.skillVal = form.skillVal;
  if(form.deck) inst.deckTemplate = [...form.deck];
}

// ============ 初始化 ============
function initGame(){
  state.stage = 0;
  state.bonusCards = [];
  state.hand = [];
  state.player = createHeroInstance(HEROES[PLAYER_HERO_KEY]);
  startStage();
}

function startStage(){
  const stageReg = STAGES[state.stage];
  state.enemy = createHeroInstance(stageReg);

  state.deck = shuffle([...state.player.deckTemplate, ...state.bonusCards].map(makeCard));
  state.enemyDeck = shuffle(state.enemy.deckTemplate.map(makeCard));
  state.enemyHand = [];
  state.enemyField = [];
  state.playerField = [];
  state.turn = 1;
  state.maxMana = 0; state.mana = 0;
  state.gameOver = false;
  state.selectedAttacker = null;
  state.heroPowerUsed = false;
  state.hand = [];
  for(let i=0;i<4;i++) drawCard(state.deck, state.hand);
  drawCard(state.deck, state.hand);

  $('stageNum').textContent = state.stage + 1;
  $('enemyName').textContent = state.enemy.name;
  $('enemyAvatar').textContent = state.enemy.avatar;
  $('enemySkillDesc').textContent = '英雄技能：' + state.enemy.heroPowerDesc;
  $('overlay').classList.add('hidden');
  log(`—— 第 ${state.stage+1} 关：${state.enemy.name} ——`);
  startPlayerTurn(true);
}

// ============ 抽牌 ============
function drawCard(deck, hand){
  if(deck.length === 0){
    if(hand === state.hand){
      state.player.hp -= 1;
      log('牌库空了，疲劳造成 1 点伤害');
      updateUI();
      checkGameOver();
    }
    return null;
  }
  const card = deck.pop();
  if(hand.length < 10) hand.push(card);
  return card;
}

// ============ 回合 ============
function startPlayerTurn(first){
  if(state.gameOver) return;
  state.turn = first ? 1 : state.turn;
  state.maxMana = Math.min(10, state.maxMana + 1);
  state.mana = state.maxMana;
  state.heroPowerUsed = false;
  if(!first) drawCard(state.deck, state.hand);
  state.playerField.forEach(m => m.canAttack = true);
  state.selectedAttacker = null;
  log(`—— 你的回合（第 ${state.turn} 回合）——`);
  updateUI();
}

function endTurn(){
  if(state.gameOver) return;
  state.selectedAttacker = null;
  // 第②步：电荷结算钩子将插在这里（我方回合结束）
  enemyTurn();
}

// ============ 敌方 AI ============
function enemyTurn(){
  if(state.gameOver) return;
  const enemy = state.enemy;
  state.enemyField.forEach(m => m.canAttack = true);

  // 英雄技能
  if(enemy.skillType === 'dot'){
    state.player.hp -= enemy.skillVal;
    log(`【${enemy.name}】英雄技能：对你造成 ${enemy.skillVal} 点伤害`);
  } else if(enemy.skillType === 'summon'){
    if(state.enemyField.length < 7){
      const m = makeCard('strike'); m.atk = 1; m.hp = 1; m.name = '火元素'; m.icon = '🔥'; m.charge = true;
      state.enemyField.push({...m, canAttack: true});
      log(`【${enemy.name}】召唤了一个 1/1 的火元素`);
    } else {
      log(`【${enemy.name}】战场已满，无法召唤火元素`);
    }
  } else if(enemy.skillType === 'drain'){
    state.player.hp -= enemy.skillVal;
    log(`【${enemy.name}】吸取生命，对你造成 ${enemy.skillVal} 点伤害`);
  }
  checkGameOver();
  if(state.gameOver) return;

  // 抽牌 + 出牌
  if(state.enemyHand.length < 5) drawCard(state.enemyDeck, state.enemyHand);
  let enemyMana = Math.min(10, 1 + Math.floor(state.turn * 0.8));
  const sorted = [...state.enemyHand].sort((a,b) => b.cost - a.cost);
  for(const card of sorted){
    if(card.cost <= enemyMana){
      if(card.type === 'minion' && state.enemyField.length >= 7) continue;
      enemyMana -= card.cost;
      state.enemyHand = state.enemyHand.filter(c => c.uid !== card.uid);
      playEnemyCard(card);
    }
  }
  // 敌方随从攻击
  state.enemyField.forEach(m => {
    if(m.canAttack && m.atk > 0){
      const taunt = state.playerField.find(p => p.taunt);
      if(taunt){
        taunt.hp -= m.atk;
        log(`敌方 ${m.name} 攻击你的 ${taunt.name}，造成 ${m.atk} 点伤害`);
        if(taunt.hp <= 0){ state.playerField = state.playerField.filter(p => p.uid !== taunt.uid); log(`你的 ${taunt.name} 被击败`); }
      } else {
        state.player.hp -= m.atk;
        log(`敌方 ${m.name} 攻击你的英雄，造成 ${m.atk} 点伤害`);
      }
      m.canAttack = false;
    }
  });
  checkGameOver();
  if(state.gameOver) return;

  state.turn++;
  state.playerField.forEach(m => m.canAttack = true);
  startPlayerTurn(false);
}

function playEnemyCard(card){
  if(card.type === 'spell'){
    if(card.dmg){
      state.player.hp -= card.dmg;
      log(`敌方施放 ${card.name}，对你造成 ${card.dmg} 点伤害`);
    } else if(card.heal){
      state.enemy.hp = Math.min(state.enemy.maxHp, state.enemy.hp + card.heal);
      log(`敌方施放 ${card.name}，恢复 ${card.heal} 点生命`);
    } else if(card.draw){
      for(let i=0;i<card.draw;i++) drawCard(state.enemyDeck, state.enemyHand);
    }
  } else {
    if(state.enemyField.length >= 7){ log('敌方战场已满，无法召唤'); return; }
    state.enemyField.push({...card, canAttack: false, maxHp: card.hp});
    log(`敌方召唤了 ${card.name} (${card.atk}/${card.hp})`);
  }
}

// ============ 玩家操作 ============
function playCard(card){
  if(state.gameOver || state.mana < card.cost) return;
  if(card.type === 'minion' && state.playerField.length >= 7) { log('战场已满'); return; }
  state.mana -= card.cost;
  state.hand = state.hand.filter(c => c.uid !== card.uid);
  if(card.type === 'spell'){
    if(card.dmg){
      if(state.enemyField.length > 0){
        const target = state.enemyField[0];
        target.hp -= card.dmg;
        log(`你施放 ${card.name}，对敌方 ${target.name} 造成 ${card.dmg} 点伤害`);
        if(target.hp <= 0){ state.enemyField = state.enemyField.filter(m => m.uid !== target.uid); log(`敌方 ${target.name} 被击败`); }
      } else {
        state.enemy.hp -= card.dmg;
        log(`你施放 ${card.name}，对敌方英雄造成 ${card.dmg} 点伤害`);
      }
    } else if(card.heal){
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + card.heal);
      log(`你施放 ${card.name}，恢复 ${card.heal} 点生命`);
    } else if(card.draw){
      for(let i=0;i<card.draw;i++) drawCard(state.deck, state.hand);
      log(`你施放 ${card.name}，抽了 ${card.draw} 张牌`);
    }
  } else {
    const m = {...card, canAttack: card.charge, maxHp: card.hp};
    state.playerField.push(m);
    log(`你召唤了 ${card.name} (${card.atk}/${card.hp})`);
    if(card.battlecry === 'heal2'){
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + 2);
      log(`战吼：恢复 2 点生命`);
    }
  }
  checkGameOver();
  updateUI();
}

function selectAttacker(minion){
  if(state.gameOver) return;
  if(!minion.canAttack || minion.atk <= 0) return;
  if(state.selectedAttacker && state.selectedAttacker.uid === minion.uid){
    state.selectedAttacker = null;
  } else {
    state.selectedAttacker = minion;
  }
  updateUI();
}

function attackTarget(target, isEnemy){
  if(!state.selectedAttacker) return;
  const attacker = state.selectedAttacker;
  if(isEnemy){
    const taunt = state.enemyField.find(m => m.taunt);
    if(taunt && taunt.uid !== target.uid){ log('必须先攻击嘲讽随从'); return; }
    if(target.isHero){
      state.enemy.hp -= attacker.atk;
      log(`你的 ${attacker.name} 攻击敌方英雄，造成 ${attacker.atk} 点伤害`);
    } else {
      target.hp -= attacker.atk;
      attacker.hp -= target.atk;
      log(`你的 ${attacker.name} 攻击敌方 ${target.name}，造成 ${attacker.atk} 点伤害，受到 ${target.atk} 点伤害`);
      if(target.hp <= 0){ state.enemyField = state.enemyField.filter(m => m.uid !== target.uid); log(`敌方 ${target.name} 被击败`); }
    }
  }
  if(attacker.hp <= 0){
    state.playerField = state.playerField.filter(m => m.uid !== attacker.uid);
    log(`你的 ${attacker.name} 被击败`);
  }
  attacker.canAttack = false;
  state.selectedAttacker = null;
  checkGameOver();
  updateUI();
}

function useHeroPower(){
  const hp = HERO_POWERS[state.player.heroPower];
  if(state.heroPowerUsed || state.mana < hp.cost || state.gameOver) return;
  state.mana -= hp.cost;
  state.heroPowerUsed = true;

  if(hp.type === 'damage'){
    if(state.enemyField.length > 0){
      const t = state.enemyField[0];
      t.hp -= hp.value;
      log(`英雄技能【${hp.name}】：对敌方 ${t.name} 造成 ${hp.value} 点伤害`);
      if(t.hp <= 0){ state.enemyField = state.enemyField.filter(m => m.uid !== t.uid); log(`敌方 ${t.name} 被击败`); }
    } else {
      state.enemy.hp -= hp.value;
      log(`英雄技能【${hp.name}】：对敌方英雄造成 ${hp.value} 点伤害`);
    }
  }

  checkGameOver();
  updateUI();
}

// ============ 胜负 ============
function checkGameOver(){
  if(state.gameOver) return;
  if(state.player.hp <= 0){
    state.gameOver = true;
    showOverlay('失败…', '你的冒险到此为止。重新开始？', [{name:'重新开始', icon:'🔄', desc:'从第一关再来', action:()=>{ initGame(); }}]);
    return;
  }
  if(state.enemy.hp <= 0){
    state.gameOver = true;
    log(`你击败了 ${state.enemy.name}！`);
    // 第③步：此处插入 Boss 二阶段变身检查（不打断 → 先结算完再变身）
    if(state.stage >= STAGES.length - 1){
      showOverlay('通关！', '你征服了暗影裂隙，成为传奇冒险者！', [{name:'再玩一次', icon:'🏆', desc:'重新开始冒险', action:()=>{ initGame(); }}]);
    } else {
      showCardChoice();
    }
  }
}

function showCardChoice(){
  const pool = shuffle([...CARD_POOL]).slice(0,3);
  const choices = pool.map(c => ({
    name: c.name, icon: c.icon,
    desc: c.type === 'minion' ? `${c.atk}/${c.hp} ${c.desc||''}` : c.desc,
    action: () => {
      state.bonusCards.push(c.id);
      state.stage++;
      startStage();
    }
  }));
  showOverlay('胜利！', '选择一张卡牌加入你的牌库，然后进入下一关。', choices);
}

function showOverlay(title, text, choices){
  $('overlayTitle').textContent = title;
  $('overlayText').textContent = text;
  const box = $('choices');
  box.innerHTML = '';
  choices.forEach(ch => {
    const d = document.createElement('div');
    d.className = 'choice-card';
    d.innerHTML = `<div class="icon">${ch.icon}</div><div class="cname">${ch.name}</div><div class="desc">${ch.desc}</div>`;
    d.onclick = () => { $('overlay').classList.add('hidden'); ch.action(); };
    box.appendChild(d);
  });
  $('overlay').classList.remove('hidden');
}

// ============ 渲染 ============
function updateUI(){
  if(!state.player || !state.enemy) return;
  const p = state.player, e = state.enemy;

  // 英雄信息（名字/头像/血量都从实例读）
  $('playerName').textContent = p.name;
  $('playerAvatar').textContent = p.avatar;
  $('playerHpFill').style.width = Math.max(0, p.hp / p.maxHp * 100) + '%';
  $('playerHpText').textContent = `${Math.max(0,p.hp)} / ${p.maxHp}`;

  $('enemyName').textContent = e.name;
  $('enemyAvatar').textContent = e.avatar;
  $('enemyHpFill').style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
  $('enemyHpText').textContent = `${Math.max(0,e.hp)} / ${e.maxHp}`;
  $('enemySkillDesc').textContent = '英雄技能：' + (e.heroPowerDesc || '');

  $('manaOrb').textContent = `${state.mana}/${state.maxMana}`;
  $('deckInfo').textContent = `牌库：${state.deck.length} 张 ｜ 手牌：${state.hand.length}`;

  const heroPower = HERO_POWERS[p.heroPower];
  $('heroPowerBtn').innerHTML = `${heroPower.icon} ${heroPower.name} <span class="mana-pip">${heroPower.cost}</span>`;
  $('heroPowerBtn').title = heroPower.desc;
  $('heroPowerBtn').disabled = state.heroPowerUsed || state.mana < heroPower.cost || state.gameOver;

  // 敌方战场
  const ef = $('enemyField');
  ef.innerHTML = '<div class="field-label">敌方随从</div>';
  state.enemyField.forEach(m => {
    const d = document.createElement('div');
    d.className = 'minion enemy' + (m.taunt ? ' taunt' : '');
    d.innerHTML = `<div class="icon">${m.icon}</div><div class="name">${m.name}</div>
      <div class="stats"><span class="atk">${m.atk}</span><span class="hp">${Math.max(0,m.hp)}</span></div>`;
    d.onclick = () => attackTarget(m, true);
    ef.appendChild(d);
  });

  // 我方战场
  const pf = $('playerField');
  pf.innerHTML = '<div class="field-label">我方随从</div>';
  state.playerField.forEach(m => {
    const d = document.createElement('div');
    const canAtk = m.canAttack && m.atk > 0 && !state.gameOver;
    d.className = 'minion' + (m.taunt ? ' taunt' : '') + (canAtk ? ' can-attack' : '') + (state.selectedAttacker?.uid === m.uid ? ' ready' : '');
    d.innerHTML = `<div class="icon">${m.icon}</div><div class="name">${m.name}</div>
      <div class="stats"><span class="atk">${m.atk}</span><span class="hp">${Math.max(0,m.hp)}</span></div>`;
    d.onclick = (e) => { e.stopPropagation(); selectAttacker(m); };
    pf.appendChild(d);
  });

  // 手牌
  const ha = $('handArea');
  ha.innerHTML = '';
  state.hand.forEach(c => {
    const d = document.createElement('div');
    d.className = 'card' + (c.type === 'spell' ? ' spell' : '') + (state.mana < c.cost || state.gameOver ? ' disabled' : '');
    const statsHtml = c.type === 'minion'
      ? `<div class="stats"><span class="atk">${c.atk}</span><span class="hp">${c.hp}</span></div>`
      : '';
    d.innerHTML = `<div class="cost">${c.cost}</div><div class="art">${c.icon}</div>
      <div class="cname">${c.name}</div><div class="desc">${c.desc}</div>${statsHtml}`;
    d.onclick = () => playCard(c);
    ha.appendChild(d);
  });

  $('enemyAvatar').onclick = () => attackTarget({isHero:true}, true);
}

// ============ 事件绑定 ============
$('endTurnBtn').onclick = endTurn;
$('heroPowerBtn').onclick = useHeroPower;

document.addEventListener('click', (e) => {
  if(!e.target.closest('.minion')) {
    state.selectedAttacker = null;
    updateUI();
  }
});

// ============ 启动 ============
initGame();
</script>
</body>
